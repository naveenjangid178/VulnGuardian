[project]
name = "ml-service"
version = "0.1.0"
description = "VulnGuardian ML service"
readme = "README.md"
authors = [
    { name = "Naveen Kumar", email = "codewithveen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pytest>=8.3.5",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
ml-service = "ml_service:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
